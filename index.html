    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; }

    a.link:hover { color: var(--muted); }
    a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    footer { margin-top: 3rem; font-size: 0.8125rem; color: var(--muted); }
